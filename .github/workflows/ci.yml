name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit

  # Posts from the network are untrusted input: nothing at medium or above, dependencies included.
  threatcrush:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g --ignore-scripts @profullstack/threatcrush@0.13.32
      - run: threatcrush scan . --deps --fail-on critical,high,medium
