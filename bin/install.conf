# bin/install.sh settings for pit-social (OpenInstall: https://logicsrc.com/openinstall).
# No secrets here: PIT_BRIDGE_KEY and PIT_SOCIAL_ADMINS go in $STATE_DIR/app.env
# (/root/.local/share/pit-social/app.env on dev2).
#
# DOMAINS is empty on purpose: nobody reaches this process directly. pit.world (the
# front door) terminates TLS for social.<name>.pit.world and forwards to 127.0.0.1:8794.
APP=pit-social
RUNTIME=bun
INSTALL_CMD=bun install --production --frozen-lockfile
BUILD_CMD=none
START_CMD=bun src/server.ts
PORT=8794
HEALTH_PATH=/health
DOMAINS=
MAX_BODY=1m
ACCESS_LOG=off
